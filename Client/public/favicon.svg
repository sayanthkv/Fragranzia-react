<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Vibrant Liquid Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="40%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#d48b00" />
    </linearGradient>

    <!-- Deep Luxury Teal & Vibrant Emerald Liquid -->
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#043948" />
    </linearGradient>
  </defs>

  <!-- Fragrance Spray Droplet (Top Right) -->
  <circle cx="28" cy="4" r="2.2" fill="url(#gold)" />
  <circle cx="23.5" cy="2" r="1.3" fill="url(#gold)" opacity="0.85" />

  <!-- Bold Metallic Gold Cap -->
  <rect x="9" y="1" width="14" height="6.5" rx="2" fill="url(#gold)" stroke="#a16207" stroke-width="0.8" />
  <line x1="12.5" y1="2.5" x2="12.5" y2="6" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.8" />

  <!-- Atomizer Collar Neck -->
  <rect x="12" y="7.5" width="8" height="2.5" rx="0.5" fill="#ca8a04" />

  <!-- Large Perfume Glass Bottle Body (Maximized to Fill Canvas) -->
  <rect x="2.5" y="10" width="27" height="20.5" rx="5" fill="url(#liquid)" stroke="#022129" stroke-width="1.3" />

  <!-- Glowing Inner Fragrance Horizon -->
  <path d="M 4 16.5 Q 16 19.5 28 16.5 L 28 25.5 C 28 28.5 25.5 30 22.5 30 L 9.5 30 C 6.5 30 4 28.5 4 25.5 Z" fill="#2ec4b6" opacity="0.65" />

  <!-- Prominent Crisp Glass Specular Highlight (Left) -->
  <path d="M 6.5 13 L 6.5 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- Subtle Rim Light (Right) -->
  <path d="M 25.5 14 L 25.5 24" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.25" />
</svg>
